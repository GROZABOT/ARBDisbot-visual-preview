<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">ARB DisBot emblem</title><desc id="desc">Neon blue D shield with a friendly robot face.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#10245d"/><stop offset=".48" stop-color="#07122f"/><stop offset="1" stop-color="#020718"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".22" stop-color="#c6eeff"/><stop offset=".48" stop-color="#8aaeff"/><stop offset=".72" stop-color="#7858ff"/><stop offset="1" stop-color="#49e7ff"/></linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5df4ff"/><stop offset=".45" stop-color="#5878ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1000" height="1000" rx="120" fill="url(#bg)"/>
